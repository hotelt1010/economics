services:
  - type: web
    name: economics-progress-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://hotelt1010.github.io
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
